<main class="container">
  <!-- Button trigger modal -->
  <button
    type="button"
    class="btn btn-primary btn-create-task"
    data-bs-toggle="modal"
    data-bs-target="#staticBackdrop"
    (click)="onOpenModal('Create New Task', true, '', '')"
  >
    Create New Task
  </button>

  <app-modal-todo-item
    [isToEditMode]="isToEditMode"
    [modalInfo]="modalInfo"
    (closeModal)="onCloseModal()"
    (createTask)="onCreateTask($event)"
    (updateTask)="onUpdateTask($event)"
  ></app-modal-todo-item>

  <table class="table">
    <thead>
      <tr>
        <th scope="col">Completed</th>
        <th scope="col">Title</th>
        <th scope="col">Text</th>
        <th scope="col">Edit</th>
        <th scope="col">Delete</th>
      </tr>
    </thead>
    <tbody>
      @for (task of taskArray; track task; let idx = $index) {
      <tr>
        <td>
          <input
            type="checkbox"
            [checked]="task.isCompleted"
            (change)="onCheckboxChange(idx)"
            class="form-check-input"
            id="checkbox"
          />
        </td>
        <td [ngClass]="{ crossed: task.isCompleted }">
          {{ task.title }}
        </td>
        <td [ngClass]="{ crossed: task.isCompleted }">{{ task.description }}</td>
        <td>
          <button
            class="btn btn-warning btn-sm btn-action"
            (click)="onEditTask(idx)"
            [disabled]="task.isCompleted"
          >
            Edit
          </button>
        </td>
        <td>
          <button class="btn btn-danger btn-sm btn-action" (click)="onDeleteTask(idx)">
            Delete
          </button>
        </td>
      </tr>
      } @empty {
      <tr>
        <td colspan="6">No tasks available.</td>
      </tr>
      }
    </tbody>
  </table>

  <p>Task acount: {{ taskArray.length }}</p>
</main>
